# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  customize_glob:
    "light.*":
      supported_color_modes:
        - color_temp

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
stream:

# Git backup shell commands
shell_command:
  git_add: '/bin/bash -c "cd /config && /usr/bin/git add -A"'
  git_diff: '/bin/bash -c "cd /config && /usr/bin/git diff --cached | head -c 120000"'
  git_write_msg: "/bin/bash -c \"printf '%s' '{{ message }}' > /tmp/commit_msg\""
  git_commit_file: '/bin/bash -c "cd /config && /usr/bin/git commit -F /tmp/commit_msg || true"'
  git_push: '/bin/bash -c "cd /config && /usr/bin/git push origin main"'

template:
  - sensor:
      # Location sensors with GPS spoofing filter (war-related)
      # GPS sometimes shows Jordan/Oman/Iraq due to military spoofing
      # Filter: lon 35.9-100 is the 'dead zone' (Jordan through Iran)
      # Real travel east of Israel starts at lon 100+ (Thailand, Japan, China)
      # Everything west (Europe, Cyprus, Africa) is unaffected
      # 'Nearby' = within 500m of home/old home but not on home WiFi
      # Home: 32.0678, 34.7843 | Old Home: 32.0685, 34.7852
      - name: "Tomer Location"
        state: >
          {% set bssid = states('sensor.tomers_iphone_bssid') %}
          {% set home_bssid = bssid is defined and bssid | length > 14 and (bssid[:14] == '98:03:8e:9a:e5' or bssid[:14] == 'a2:03:8e:9a:e5' or bssid[:14] == 'e0:d3:62:ac:e6') %}
          {% set person = states('person.tomer') %}
          {% set lat = state_attr('person.tomer', 'latitude') | float(0) %}
          {% set lon = state_attr('person.tomer', 'longitude') | float(0) %}
          {% set dist_home = ((lat - 32.0678)**2 + (lon - 34.7843)**2)**0.5 * 111000 %}
          {% set dist_old = ((lat - 32.0685)**2 + (lon - 34.7852)**2)**0.5 * 111000 %}
          {% set ssid = states('sensor.tomers_iphone_ssid') %}
          {% set home_ssids = ['noobchi', 'Noobchi_2.4', 'noobchi_MLO'] %}
          {% if home_bssid %}Home
          {% elif ssid in home_ssids and not home_bssid %}Old Home
          {% elif lon > 35.9 and lon < 100 %}GPS Unreliable
          {% elif person in ['Old Home', 'home'] and not home_bssid %}Nearby
          {% elif person not in ['home', 'not_home'] %}{{ person | replace('_', ' ') | title }}
          {% elif (dist_home < 150 or dist_old < 150) and not home_bssid %}Nearby
          {% else %}{{ person | replace('_', ' ') | title }}
          {% endif %}
        icon: >
          {% set bssid = states('sensor.tomers_iphone_bssid') %}
          {% set home_bssid = bssid is defined and bssid | length > 14 and (bssid[:14] == '98:03:8e:9a:e5' or bssid[:14] == 'a2:03:8e:9a:e5' or bssid[:14] == 'e0:d3:62:ac:e6') %}
          {% set lat = state_attr('person.tomer', 'latitude') | float(0) %}
          {% set lon = state_attr('person.tomer', 'longitude') | float(0) %}
          {% set dist_home = ((lat - 32.0678)**2 + (lon - 34.7843)**2)**0.5 * 111000 %}
          {% set dist_old = ((lat - 32.0685)**2 + (lon - 34.7852)**2)**0.5 * 111000 %}
          {% set ssid = states('sensor.tomers_iphone_ssid') %}
          {% set home_ssids = ['noobchi', 'Noobchi_2.4', 'noobchi_MLO'] %}
          {% if home_bssid %}mdi:home-account
          {% elif ssid in home_ssids and not home_bssid %}mdi:home-outline
          {% elif lon > 35.9 and lon < 100 %}mdi:crosshairs-question
          {% elif dist_home < 150 or dist_old < 150 %}mdi:map-marker-radius
          {% else %}mdi:map-marker
          {% endif %}
      - name: "Anyone Home"
        state: >
          {% set tomer_bssid = states('sensor.tomers_iphone_bssid') %}
          {% set masha_bssid = states('sensor.pixel_8_pro_wi_fi_bssid') %}
          {% set masha_ssid = states('sensor.pixel_8_pro_wi_fi_connection') %}
          {% set home_ssids = ['noobchi', 'Noobchi_2.4', 'noobchi_MLO'] %}
          {% set masha_lat = state_attr('person.masha', 'latitude') | float(0) %}
          {% set masha_lon = state_attr('person.masha', 'longitude') | float(0) %}
          {% set masha_dist = ((masha_lat - 32.0678)**2 + (masha_lon - 34.7843)**2)**0.5 * 111000 %}
          {% set tomer_home = tomer_bssid | length > 14 and (tomer_bssid[:14] == '98:03:8e:9a:e5' or tomer_bssid[:14] == 'a2:03:8e:9a:e5' or tomer_bssid[:14] == 'e0:d3:62:ac:e6') %}
          {% set masha_home = (masha_bssid | length > 14 and (masha_bssid[:14] == '98:03:8e:9a:e5' or masha_bssid[:14] == 'a2:03:8e:9a:e5' or masha_bssid[:14] == 'e0:d3:62:ac:e6')) or (masha_ssid in home_ssids and masha_dist < 100) %}
          {% if tomer_home or masha_home %}yes
          {% else %}no
          {% endif %}
      - name: "Masha Location"
        state: >
          {% set person = states('person.masha') %}
          {% set bssid = states('sensor.pixel_8_pro_wi_fi_bssid') %}
          {% set ssid = states('sensor.pixel_8_pro_wi_fi_connection') %}
          {% set home_bssid = bssid is defined and bssid | length > 14 and (bssid[:14] == '98:03:8e:9a:e5' or bssid[:14] == 'a2:03:8e:9a:e5' or bssid[:14] == 'e0:d3:62:ac:e6') %}
          {% set home_ssids = ['noobchi', 'Noobchi_2.4', 'noobchi_MLO'] %}
          {% set lat = state_attr('person.masha', 'latitude') | float(0) %}
          {% set lon = state_attr('person.masha', 'longitude') | float(0) %}
          {% set dist_home = ((lat - 32.0678)**2 + (lon - 34.7843)**2)**0.5 * 111000 %}
          {% set dist_old = ((lat - 32.0685)**2 + (lon - 34.7852)**2)**0.5 * 111000 %}
          {% if home_bssid %}Home
          {% elif ssid in home_ssids and not home_bssid %}Old Home
          {% elif lon > 35.9 and lon < 100 %}GPS Unreliable
          {% elif (dist_home < 150 or dist_old < 150) %}Nearby
          {% else %}{{ person | replace('_', ' ') | title }}
          {% endif %}
        icon: >
          {% set bssid = states('sensor.pixel_8_pro_wi_fi_bssid') %}
          {% set ssid = states('sensor.pixel_8_pro_wi_fi_connection') %}
          {% set home_bssid = bssid is defined and bssid | length > 14 and (bssid[:14] == '98:03:8e:9a:e5' or bssid[:14] == 'a2:03:8e:9a:e5' or bssid[:14] == 'e0:d3:62:ac:e6') %}
          {% set home_ssids = ['noobchi', 'Noobchi_2.4', 'noobchi_MLO'] %}
          {% set lat = state_attr('person.masha', 'latitude') | float(0) %}
          {% set lon = state_attr('person.masha', 'longitude') | float(0) %}
          {% set dist_home = ((lat - 32.0678)**2 + (lon - 34.7843)**2)**0.5 * 111000 %}
          {% set dist_old = ((lat - 32.0685)**2 + (lon - 34.7852)**2)**0.5 * 111000 %}
          {% if home_bssid %}mdi:home-account
          {% elif ssid in home_ssids and not home_bssid %}mdi:home-outline
          {% elif lon > 35.9 and lon < 100 %}mdi:crosshairs-question
          {% elif dist_home < 150 or dist_old < 150 %}mdi:map-marker-radius
          {% else %}mdi:map-marker
          {% endif %}
  - alarm_control_panel:
      - name: "Home Alarm"
        code_arm_required: false
        code_format: no_code
        state: >
          {% set s1 = states('alarm_control_panel.camera_hub_g3_547b_security_system_2') %}
          {% set s2 = states('alarm_control_panel.doorbell_repeater_aa37_security_system') %}
          {% if s2 in ['unavailable', 'unknown'] %}{{ s1 }}
          {% elif s1 in ['unavailable', 'unknown'] %}{{ s2 }}
          {% elif s1 == s2 %}{{ s1 }}
          {% else %}armed_custom_bypass
          {% endif %}
        arm_away:
          - action: alarm_control_panel.alarm_arm_away
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
        arm_home:
          - action: alarm_control_panel.alarm_arm_home
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
        arm_night:
          - action: alarm_control_panel.alarm_arm_night
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
        disarm:
          - action: alarm_control_panel.alarm_disarm
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system

