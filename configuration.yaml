# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
stream:

# Git backup shell commands
shell_command:
  git_add: '/bin/bash -c "cd /config && /usr/bin/git add -A"'
  git_diff: '/bin/bash -c "cd /config && /usr/bin/git diff --cached --stat"'
  git_commit: '/bin/bash -c "cd /config && /usr/bin/git commit -m \"{{ message }}\" || true"'
  git_push: '/bin/bash -c "cd /config && /usr/bin/git push origin main"'

template:
  - alarm_control_panel:
      - name: "Home Alarm"
        code_arm_required: false
        code_format: no_code
        state: >
          {% set s1 = states('alarm_control_panel.camera_hub_g3_547b_security_system_2') %}
          {% set s2 = states('alarm_control_panel.doorbell_repeater_aa37_security_system') %}
          {% if s1 == s2 %}{{ s1 }}
          {% else %}armed_custom_bypass
          {% endif %}
        arm_away:
          - action: alarm_control_panel.alarm_arm_away
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
        arm_home:
          - action: alarm_control_panel.alarm_arm_home
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
        arm_night:
          - action: alarm_control_panel.alarm_arm_night
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
        disarm:
          - action: alarm_control_panel.alarm_disarm
            target:
              entity_id:
                - alarm_control_panel.camera_hub_g3_547b_security_system_2
                - alarm_control_panel.doorbell_repeater_aa37_security_system
