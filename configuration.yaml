# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
stream:

# Git backup shell commands
shell_command:
  git_add: '/bin/bash -c "cd /config && /usr/bin/git add -A"'
  git_diff: '/bin/bash -c "cd /config && /usr/bin/git diff --cached --stat"'
  git_commit: '/bin/bash -c "cd /config && /usr/bin/git commit -m \"{{ message }}\" || true"'
  git_push: '/bin/bash -c "cd /config && /usr/bin/git push origin main"'
