- id: git_backup_nightly
  alias: Git Backup with AI Commit Message
  description: Nightly backup to GitHub with AI commit message
  trigger:
  - platform: time
    at: 03:17:00
  action:
  - service: shell_command.git_add
  - delay:
      seconds: 2
  - service: shell_command.git_diff
    response_variable: git_diff_output
  - condition: template
    value_template: '{{ git_diff_output[''stdout''] | length > 0 }}'
  - service: ai_task.generate_data
    data:
      entity_id: ai_task.google_ai_task
      task_name: Generate git commit message
      instructions: 'Generate a concise git commit message (max 72 chars) for these
        Home Assistant config changes. Be specific about what changed. No quotes around
        the message. Changes: {{ git_diff_output[''stdout''] }}

        '
    response_variable: ai_response
  - service: shell_command.git_commit
    data:
      message: '{{ ai_response.data.text | default(''Auto-backup'') }}'
  - delay:
      seconds: 2
  - service: shell_command.git_push
  mode: single
- id: '1771853128981'
  alias: 'Alarm: Away When Everyone Leaves'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.tomer
    - person.masha
    to: not_home
  conditions:
  - condition: template
    value_template: '{{ states.person | selectattr(''state'', ''eq'', ''home'') |
      list | length == 0 }}

      '
  actions:
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
- id: '1771853172731'
  alias: 'Alarm: Home When Someone Arrives'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.tomer
    - person.masha
    to: home
  actions:
  - action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
