- id: git_backup_nightly
  alias: Git Backup with AI Commit Message
  description: Nightly backup to GitHub with AI commit message
  triggers:
  - at: 03:17:00
    trigger: time
  actions:
  - action: shell_command.git_add
  - delay:
      seconds: 2
  - response_variable: git_diff_output
    action: shell_command.git_diff
  - condition: template
    value_template: '{{ git_diff_output[''stdout''] | length > 0 }}'
  - data:
      entity_id: ai_task.google_ai_task
      task_name: Generate git commit message
      instructions: 'Write a git commit in this exact format: Line 1: a specific imperative
        subject <= 72 chars (no quotes). Then a blank line. Then 1-3 bullet points
        explaining the main changes (each bullet <= 100 chars). If changes are noisy
        (cache/storage), mention it in one bullet and focus on the real intent. Base
        everything only on this diff: {{ git_diff_output[''stdout''] }}

        '
    response_variable: ai_response
    action: ai_task.generate_data
  - data:
      message: '{{ ai_response.data | default(''Auto-backup'') }}'
    action: shell_command.git_commit
  - delay:
      seconds: 2
  - action: shell_command.git_push
  mode: single
- id: '1771853128981'
  alias: 'Alarm: Away When Everyone Leaves'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.tomer
    - person.masha
    to: not_home
  conditions:
  - condition: template
    value_template: '{{ states.person | selectattr(''state'', ''eq'', ''home'') |
      list | length == 0 }}

      '
  actions:
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
- id: '1771853172731'
  alias: 'Alarm: Home When Someone Arrives'
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - person.tomer
    - person.masha
    to: home
  actions:
  - action: alarm_control_panel.alarm_arm_home
    target:
      entity_id: alarm_control_panel.home_alarm
  mode: single
